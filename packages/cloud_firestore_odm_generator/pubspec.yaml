name: cloud_firestore_odm_generator
description: A code generator for cloud_firestore_odm.
homepage: https://firebase.flutter.dev/docs/firestore/odm
repository: https://github.com/firebaseextended/firestoreodm-flutter
version: 1.0.0-dev.90

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  analyzer: ">=8.0.0 <11.0.0"
  build: ^4.0.5
  build_config: ^1.0.0
  cloud_firestore_odm: ^1.0.0-dev.87
  collection: ^1.15.0
  freezed_annotation: ">=1.0.0 <4.0.0"
  # Can be removed once this is fixed https://github.com/dart-lang/graphs/issues/86
  graphs: ^2.0.0
  json_annotation: ^4.8.1
  meta: ^1.8.0
  recase: ^4.0.0
  source_gen: ^4.2.2
  source_helper: ^1.3.11

dev_dependencies:
  build_runner: ^2.13.1
  expect_error: ^1.0.5
  json_serializable: ">=6.11.0 <7.0.0"
  matcher: ^0.12.19
  test: ">=1.29.0 <1.31.0"
